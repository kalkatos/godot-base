[plugin]

name="Team Editor Settings"
description="Applies project-scoped values to editor settings on project open: LSP remote port and theme accent color. Enforcing the accent pins the editor color preset to Custom and disables follow-system-theme. Per-setting enable toggles in Project Settings."
author="Mahou"
version="1.0"
script="plugin.gd"
godot_version_min="4.0"